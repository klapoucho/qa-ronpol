name: Tests

# Pull requests run the smoke tests plus the tests their change touches (scripts/pr-tests.sh).
# main, the nightly run and manual runs check the full suite, so nothing goes untested for long.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A pull request shares one group, so a new push replaces its older run. Every other run gets a
# group of its own: full-suite runs never cancel or replace each other, pending ones included.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ENV: ci
    outputs:
      report: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull-request selection compares the change with its base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: check
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run app:up
      - name: Run the tests this pull request needs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/pr-tests.sh "origin/$BASE_REF"
      - name: Run the full suite
        if: github.event_name != 'pull_request'
        run: npm test
      # Coverage against the OpenAPI contract, on the run's summary page. A contract that differs
      # from the running app's fails this step (scripts/api-coverage.ts). It runs whether the tests
      # passed or failed, but only once the static checks passed: without them it cannot list the
      # tests and would only repeat their failure.
      - name: Report API coverage
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: npm run --silent coverage:api >> "$GITHUB_STEP_SUMMARY"
      - name: Collect application logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/app.log
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      # Full-suite runs also publish the HTML report on the repository's GitHub Pages site, where it
      # opens in the browser with its traces (the report job below). A pull request keeps the
      # downloadable artifact only: a pull request from a fork gets no permission to publish.
      - name: Mark the report for publishing
        id: pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('playwright-report/index.html') != '' }}
        run: echo "The report job publishes playwright-report/."
      - name: Say where the report is
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('playwright-report/index.html') != '' }}
        run: echo 'Full report - the `playwright-report` artifact of this run (download it and open `index.html`).' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload run reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-reports
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  # Publishes the report of a full-suite run, also when its tests failed: that is when it is read.
  # Each run gets its own address, runs/<run number>/, and the newest 20 are kept
  # (scripts/publish-report.sh).
  report:
    needs: tests
    if: ${{ !cancelled() && needs.tests.outputs.report == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes the gh-pages branch
    # One publication at a time: each starts from the reports already published.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report
      - run: scripts/publish-report.sh playwright-report "$GITHUB_RUN_NUMBER"
      - name: Link the report on the run's summary page
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "Full Playwright report with traces - $site/runs/$GITHUB_RUN_NUMBER/ (GitHub Pages needs about a minute to show it; older runs - $site/runs/)" >> "$GITHUB_STEP_SUMMARY"
