name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ENV: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run app:up
      - run: npm test
      - name: Collect application logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/app.log
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload run reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-reports
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
