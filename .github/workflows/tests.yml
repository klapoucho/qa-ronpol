name: Tests

# Pull requests run the smoke tests plus the tests their change touches (scripts/pr-tests.sh).
# main, the nightly run and manual runs check the full suite, so nothing goes untested for long.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A pull request shares one group, so a new push replaces its older run. Every other run gets a
# group of its own: full-suite runs never cancel or replace each other, pending ones included.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_ENV: ci
    outputs:
      report: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull-request selection compares the change with its base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: check
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run app:up
      - name: Run the tests this pull request needs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/pr-tests.sh "origin/$BASE_REF"
      - name: Run the full suite
        if: github.event_name != 'pull_request'
        run: npm test
      # Coverage against the OpenAPI contract, on the run's summary page. A contract that differs
      # from the running app's fails this step (scripts/api-coverage.ts). It runs whether the tests
      # passed or failed, but only once the static checks passed: without them it cannot list the
      # tests and would only repeat their failure.
      - name: Report API coverage
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: npm run --silent coverage:api >> "$GITHUB_STEP_SUMMARY"
      - name: Collect application logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/app.log
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      # Full-suite runs also publish the HTML report as the repository's GitHub Pages site, where it
      # opens in the browser with its traces. A pull request keeps the downloadable artifact only:
      # the site holds one report, and a pull request from a fork must not replace it.
      - name: Hand the Playwright report to GitHub Pages
        id: pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/
      - name: Say where the report is
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('playwright-report/index.html') != '' }}
        run: echo 'Full report - the `playwright-report` artifact of this run (download it and open `index.html`).' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload run reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-reports
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  # Publishes the report of a full-suite run, also when its tests failed: that is when it is read.
  report:
    needs: tests
    if: ${{ !cancelled() && needs.tests.outputs.report == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a newer report waits for the one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Link the report on the run's summary page
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: echo "Full Playwright report with traces - $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
